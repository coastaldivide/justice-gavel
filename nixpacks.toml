# Nixpacks build (used only when the Railway service builds from the REPO ROOT).
# Preferred: set the Railway service Root Directory to "backend" so it builds
# backend/Dockerfile via backend/railway.json.
[phases.setup]
nixPkgs = ["nodejs_22"]

[phases.install]
cmds = ["cd backend && npm ci --omit=dev"]

[phases.build]
cmds = ["echo 'No build step needed'"]

[start]
cmd = "cd backend && node --import ./src/instrument.js src/server.js"
