name: CI

on:
  push:
    branches: [main, develop]
  # every pull request, whatever branch it targets (feature branches were never checked before)
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ───────────────────────────────────────────────────────────────────────────
  # Backend: lint, migrations on a real Postgres 16, boot in production mode,
  # end-to-end smoke test, then the full jest suite (in-memory store).
  # Every step is blocking.
  # ───────────────────────────────────────────────────────────────────────────
  backend:
    name: Backend (lint + Postgres + smoke + jest)
    runs-on: ubuntu-latest
    timeout-minutes: 45

    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: jg_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d jg_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      CI_DATABASE_URL: postgres://postgres:postgres@localhost:5432/jg_ci
      API_PORT: "4000"
      ANTHROPIC_MOCK_PORT: "4010"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies (high+)
        run: npm audit --omit=dev --audit-level=high

      - name: ESLint (0 errors, 0 warnings)
        run: npm run lint

      - name: Import smoke (app module loads)
        env:
          NODE_ENV: test
        run: node -e "import('./src/app.js').then(() => { console.log('app.js imported OK'); process.exit(0); }, (e) => { console.error(e); process.exit(1); })"

      - name: Apply database migrations (supabase/migrations, in order)
        working-directory: .
        env:
          PGOPTIONS: "-c client_min_messages=warning"
        run: |
          set -euo pipefail
          for f in $(ls supabase/migrations/*.sql | sort); do
            echo "::group::$f"
            psql "$CI_DATABASE_URL" -v ON_ERROR_STOP=1 -q -f "$f"
            echo "::endgroup::"
          done
          psql "$CI_DATABASE_URL" -Atc "select count(*) || ' tables in public' from information_schema.tables where table_schema='public'"

      - name: Generate production secrets
        run: |
          set -euo pipefail
          for k in JWT_SECRET:48 JWT_REFRESH_SECRET:48 ENCRYPTION_KEY:32 ADMIN_KEY:24; do
            name=${k%%:*}; bytes=${k##*:}
            val=$(openssl rand -hex "$bytes")
            echo "::add-mask::$val"
            echo "$name=$val" >> "$GITHUB_ENV"
          done

      - name: Start API server (NODE_ENV=production, no Stripe, mock Anthropic)
        env:
          NODE_ENV: production
          PORT: ${{ env.API_PORT }}
          DATABASE_URL: ${{ env.CI_DATABASE_URL }}
          ANTHROPIC_API_KEY: dummy
          ANTHROPIC_BASE_URL: http://127.0.0.1:${{ env.ANTHROPIC_MOCK_PORT }}
        run: |
          set -euo pipefail
          # same V8 heap cap as the production image (backend/Dockerfile): 5/8 of the 512 MB limit
          nohup node --max-old-space-size=320 --import ./src/instrument.js src/server.js > "$RUNNER_TEMP/server.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/server.pid"
          for i in $(seq 1 60); do
            if curl -fsS "http://localhost:${API_PORT}/health" > "$RUNNER_TEMP/health.json" 2>/dev/null; then
              cat "$RUNNER_TEMP/health.json"; echo
              grep -q '"db":"ok"' "$RUNNER_TEMP/health.json" || { echo "::error::/health does not report db ok"; exit 1; }
              exit 0
            fi
            if ! kill -0 "$(cat "$RUNNER_TEMP/server.pid")" 2>/dev/null; then
              echo "::error::API server exited during startup"; cat "$RUNNER_TEMP/server.log"; exit 1
            fi
            sleep 1
          done
          echo "::error::API server did not become healthy within 60s"
          cat "$RUNNER_TEMP/server.log"
          exit 1

      - name: End-to-end smoke test (real Postgres)
        env:
          DATABASE_URL: ${{ env.CI_DATABASE_URL }}
        run: node scripts/smoke-test.mjs "http://localhost:${API_PORT}" --anthropic-mock "${ANTHROPIC_MOCK_PORT}"

      - name: Route sweep (every mounted route × 6 callers, valid + junk input)
        # scripts/route-sweep.mjs: no 5xx / hang, 401 / 403 / 404 where they belong,
        # no IDOR, { error, code, message } JSON in the request language, no stack
        # traces, openapi.json in sync, lawyer / bail-agent rows unchanged.
        env:
          DATABASE_URL: ${{ env.CI_DATABASE_URL }}
        run: node scripts/route-sweep.mjs "http://localhost:${API_PORT}" --db-url "$CI_DATABASE_URL" --admin-key "$ADMIN_KEY" --json "$RUNNER_TEMP/route-sweep.json"

      - name: Sample-arrest filter, flat lead fee, takedown review on real Postgres (jest)
        # Runs the real arrests / billing / alerts routers and outbound-bot / alert
        # services against the migrated database (600 seed_v1 rows): seeds never come
        # back by default, come back flagged with SHOW_SAMPLE_ARRESTS=true, and are never
        # alerted on, messaged about or sold; a user's takedown request stays pending
        # until staff approve it, and only staff record dispositions.
        # Skipped in the in-memory jest run below.
        env:
          TEST_DATABASE_URL: ${{ env.CI_DATABASE_URL }}
        run: node --experimental-vm-modules node_modules/.bin/jest --no-coverage --ci src/__tests__/arrest_visibility.test.js src/__tests__/alerts_takedown_pg.test.js src/__tests__/final_pass_fixes.test.js

      - name: Postgres client tools present (backup/restore test must not skip)
        # integration/backup_restore.int.test.js runs scripts/db-backup.sh and
        # db-restore.sh; it skips itself when pg_dump/pg_restore are missing, so
        # fail here instead of silently not testing backups.
        run: pg_dump --version && pg_restore --version && psql --version

      - name: Route integration suite on real Postgres (jest)
        # Every route group the app calls (auth, cases, chat/jobs, providers,
        # account export/deletion (no orphans), idempotency + list bounds + AI
        # budget, transactions, malformed-input fuzz, backup/restore round trip,
        # messages, billing/consultations, bail/legaldata/expungement, push,
        # saved/reviews, and the "Just arrested?" core path: rights card, combined
        # lawyer + bail search, listing reports/claims, court dates + reminders,
        # .ics, family followers with consent) exercised end-to-end against the
        # migrated database. Also the Render pre-deploy migration runner
        # (backend/scripts/migrate.sh: fresh DB, ledger replay, failure stops,
        # --baseline) on scratch databases it creates and drops.
        # These suites skip themselves in the in-memory jest run below.
        env:
          TEST_DATABASE_URL: ${{ env.CI_DATABASE_URL }}
        # Two workers: the suites share one database, and four parallel suites hit jest's 5 s hook
        # timeout on a 2-core runner (seen Oct 26 2026) — slower, never flaky.
        run: node --experimental-vm-modules node_modules/.bin/jest --no-coverage --ci --maxWorkers=2 src/__tests__/integration

      - name: Security regression suite on real Postgres (jest)
        # audit11 attacks replayed against the real app: attorney self-assignment
        # (C1), lead contact unlock (C2), cross-firm matter / privilege / finance
        # IDOR (C3/C4/H5/H6/M8), upload memory DoS (C5), public check-in routes
        # (H1/H2), stale token roles + admin provider tables (H3/H4), translation
        # session abuse (H7), SAML forgery (H8), webhook SSRF (H9), email HTML
        # injection (M4), and the admin-only client-IP diagnostics used to set
        # TRUST_PROXY. Each test proves the attack fails AND the legitimate
        # flow still works. The PG-gated suites skip in the in-memory run below.
        env:
          TEST_DATABASE_URL: ${{ env.CI_DATABASE_URL }}
        run: node --experimental-vm-modules node_modules/.bin/jest --no-coverage --ci --maxWorkers=2 src/__tests__/security

      - name: Data refresh suite on real Postgres (jest)
        # Scrapers / importers / scheduler write the main database through
        # services/dataRefresh (Google Places mocked, no network): new providers
        # inserted, changes to existing lawyers / bail agents staged as
        # proposals (never written), reruns idempotent, absent rows kept, admin
        # apply/reject guarded by live role + X-Admin-Key, missing key = logged
        # skip, LIVE_REFRESH scheduler wiring, pre-existing provider rows
        # byte-identical (md5). Runs in band, after the suites above, because it
        # inserts (and removes) fixture providers in the shared database.
        env:
          TEST_DATABASE_URL: ${{ env.CI_DATABASE_URL }}
        run: node --experimental-vm-modules node_modules/.bin/jest --no-coverage --ci --runInBand src/__tests__/refresh

      - name: Stop API server
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/server.pid" ]; then kill "$(cat "$RUNNER_TEMP/server.pid")" 2>/dev/null || true; fi
          echo "── server log (tail) ──"
          tail -n 200 "$RUNNER_TEMP/server.log" 2>/dev/null || true

      - name: Jest suite (in-memory store, no DATABASE_URL)
        # src/__tests__/env.js sets NODE_ENV=test and test secrets; DATABASE_URL is
        # deliberately not set so routes use the in-memory fallback.
        run: node --experimental-vm-modules node_modules/.bin/jest --no-coverage --ci

  # ───────────────────────────────────────────────────────────────────────────
  # Web journeys: the production web export driven in headless Chromium against
  # a production-mode API on a migrated Postgres, with the scriptable Anthropic
  # mock (backend/scripts/anthropic-mock.mjs). frontend/scripts/run-all-journeys.sh
  # runs web-journeys-*.cjs and web-journeys.cjs; any failure fails the job.
  # ───────────────────────────────────────────────────────────────────────────
  journeys:
    name: Web journeys (production API + Chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 60

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: jg_journeys
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d jg_journeys"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      CI_DATABASE_URL: postgres://postgres:postgres@localhost:5432/jg_journeys
      API_PORT: "4300"
      MOCK_PORT: "4399"
      WEB_PORT: "8300"
      CI: "1"
      EXPO_NO_TELEMETRY: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Install dependencies
        run: |
          (cd backend && npm ci)
          (cd frontend && npm ci)

      - name: Apply database migrations (the Render pre-deploy runner)
        env:
          DATABASE_URL: ${{ env.CI_DATABASE_URL }}
        run: sh backend/scripts/migrate.sh

      - name: Generate production secrets
        run: |
          set -euo pipefail
          for k in JWT_SECRET:48 JWT_REFRESH_SECRET:48 ENCRYPTION_KEY:32 ADMIN_KEY:24; do
            name=${k%%:*}; bytes=${k##*:}
            val=$(openssl rand -hex "$bytes")
            echo "::add-mask::$val"
            echo "$name=$val" >> "$GITHUB_ENV"
          done

      - name: Start the Anthropic mock and the API (NODE_ENV=production, no Stripe)
        working-directory: backend
        env:
          NODE_ENV: production
          PORT: ${{ env.API_PORT }}
          DATABASE_URL: ${{ env.CI_DATABASE_URL }}
          ANTHROPIC_API_KEY: dummy
          ANTHROPIC_BASE_URL: http://127.0.0.1:${{ env.MOCK_PORT }}
          CORS_ORIGIN: http://localhost:${{ env.WEB_PORT }}
        run: |
          set -euo pipefail
          nohup node scripts/anthropic-mock.mjs "$MOCK_PORT" > "$RUNNER_TEMP/mock.log" 2>&1 &
          # same V8 heap cap as the production image (backend/Dockerfile): 5/8 of the 512 MB limit
          nohup node --max-old-space-size=320 --import ./src/instrument.js src/server.js > "$RUNNER_TEMP/server.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/server.pid"
          for i in $(seq 1 60); do
            curl -fsS "http://localhost:${API_PORT}/health" > /dev/null 2>&1 && curl -fsS "http://127.0.0.1:${MOCK_PORT}/__requests" > /dev/null 2>&1 && exit 0
            sleep 1
          done
          echo "::error::API or Anthropic mock did not start"; cat "$RUNNER_TEMP/server.log"; exit 1

      - name: Export the web app against this API
        working-directory: frontend
        env:
          EXPO_PUBLIC_API_BASE: http://localhost:${{ env.API_PORT }}/api
        run: npx expo export --platform web --output-dir dist

      - name: Install Playwright Chromium
        working-directory: frontend
        run: |
          npm install --no-save playwright@1.56.0
          npx playwright install --with-deps chromium

      - name: Run every web journey
        working-directory: frontend
        run: bash scripts/run-all-journeys.sh dist "$RUNNER_TEMP/journeys" --api "http://localhost:${API_PORT}/api" --mock "http://127.0.0.1:${MOCK_PORT}" --db-url "$CI_DATABASE_URL" --port "$WEB_PORT"

      - name: Upload journey screenshots and logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: web-journeys
          path: ${{ runner.temp }}/journeys
          retention-days: 7

      - name: Stop API server
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/server.pid" ]; then kill "$(cat "$RUNNER_TEMP/server.pid")" 2>/dev/null || true; fi
          tail -n 200 "$RUNNER_TEMP/server.log" 2>/dev/null || true

  # ───────────────────────────────────────────────────────────────────────────
  # Frontend: clean install, types, lint, tests, navigation targets, exports.
  # ───────────────────────────────────────────────────────────────────────────
  frontend:
    name: Frontend (types + lint + tests + export)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    defaults:
      run:
        working-directory: frontend

    env:
      CI: "1"
      EXPO_NO_TELEMETRY: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript type check
        run: npx tsc --noEmit

      - name: ESLint (0 errors, 0 warnings)
        run: npx eslint src App.tsx --max-warnings 0

      - name: Navigation targets resolve
        run: node scripts/check-nav-targets.mjs

      - name: Design audit (contrast AA both themes, raw hex, a11y, touch targets)
        run: node scripts/design-audit.mjs --ci

      - name: Jest (logic + render suites)
        run: npm test

      - name: Export web bundle
        run: npx expo export --platform web --output-dir dist

      - name: Verify web bundle (app screens present, no Electron code)
        run: |
          set -euo pipefail
          js=dist/_expo/static/js/web
          test -f dist/index.html
          cat $js/*.js > "$RUNNER_TEMP/web-bundle.js"
          if grep -qE "electron-log|electron-updater|ipcRenderer" "$RUNNER_TEMP/web-bundle.js"; then
            echo "::error::Electron code found in the web bundle"; exit 1
          fi
          # Home (and the offline screens) are bundled with the app since Oct 19 so they open with no
          # network; the rest load as chunks.
          grep -q '"home-screen"' "$RUNNER_TEMP/web-bundle.js" || { echo "::error::HomeScreen missing from web bundle"; exit 1; }
          for s in ChatScreen LawyersScreen PaymentsScreen SettingsScreen; do
            compgen -G "$js/$s-*.js" > /dev/null || { echo "::error::$s chunk missing from web bundle"; exit 1; }
          done
          grep -q "Justice Gavel" "$RUNNER_TEMP/web-bundle.js"
          echo "web bundle: $(ls $js | wc -l) chunks, $(du -sh $js | cut -f1)"

      - name: Export Android bundle
        run: npx expo export --platform android --output-dir dist-android

      - name: Raw hex colours in screens (must stay at zero; print-CSS templates excluded)
        run: |
          VIOLATIONS=$(grep -rn "#[0-9A-Fa-f]\{6\}" src/screens/ \
            --include="*.tsx" | grep -v "//\|COLORS\.\|theme\." \
            | grep -v "font-family\|font-size\|font-weight\|border-left\|border-bottom\|<style" | wc -l)
          echo "Hex color violations: $VIOLATIONS"
          if [ "$VIOLATIONS" -gt 0 ]; then
            echo "::error::$VIOLATIONS raw hex colors found in screens — use theme tokens"
            exit 1
          fi
